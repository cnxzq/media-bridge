<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTSP2WS 新版</title><style>body{font:16px system-ui,sans-serif;max-width:900px;padding:0 1rem;margin:2rem auto;line-height:1.6}form,.controls{display:flex;flex-wrap:wrap;gap:.5rem}input{flex:1;min-width:240px}button,input,select{font:inherit;padding:.5rem}iframe{border:0;background:#111;width:100%;aspect-ratio:16/9;margin-top:1rem}small{color:#555}</style></head><body><nav><a href="/status">服务器状态</a></nav><h1>RTSP 音视频播放器</h1><form id="form"><input id="url" placeholder="rtsp://摄像机地址/流" required><select id="mode"><option value="copy">源编码直通</option><option value="compatible">兼容性转码</option></select><button>创建流</button></form><p><small>源编码直通的播放能力取决于摄像机编码；兼容性转码更耗 CPU。浏览器通常要求手动开启声音。</small></p><div class="controls"><select id="protocol"><option value="webrtc">WebRTC：低延迟</option><option value="hls">HLS：兼容优先</option></select><button id="play" disabled>播放</button><button id="stop" disabled>移除流</button></div><p role="status" id="status">等待创建流</p><div id="player"></div><script type="module" src="/app.js"></script></body></html>
